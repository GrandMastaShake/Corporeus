[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corporeus"
version = "2.0.0"
description = "Corporeus — AST Security Scanner. Detects 8 CWE classes via static analysis."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "bandit[toml]>=1.7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/corporeus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.bandit]
targets = ["src/corporeus"]
exclude_dirs = ["tests", ".venv", "venv"]
skips = ["B101"]
recursive = true
